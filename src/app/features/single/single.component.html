<h1 class="visually-hidden">Download options</h1>

<d4m-page-container size="lg" padding="split">
  <div class="single" [class.fs-on]="frameSizeOn()" [class.trim-on]="trimOn()">
    <d4m-media-thumbnail
      class="a-info"
      variant="single"
      [item]="item()"
      [sizeOverride]="estimatedSize()"
    />

    <d4m-file-name
      class="a-name"
      [(value)]="fileName"
      [extension]="settings().format"
      [fallback]="item().title"
    />

    <d4m-download-options layout="contents" [(settings)]="settings" [catalog]="catalog()" />

    <d4m-frame-size class="a-framesize" [(open)]="frameSizeOn" />

    <d4m-trim-video
      class="a-trim"
      [(open)]="trimOn"
      [durationSec]="item().durationSec"
      [(segments)]="segments"
    />

    <d4m-nav-buttons
      class="a-download"
      size="lg"
      [buttons]="buttons()"
      (pressed)="onPressed($event)"
    />
  </div>

  @if (error()) {
    <p class="single__error" role="alert">{{ error() }}</p>
  }
</d4m-page-container>
