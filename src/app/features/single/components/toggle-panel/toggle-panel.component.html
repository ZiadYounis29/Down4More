<d4m-panel [padding]="padding()" [class.tp--disabled]="disabled()" [class.tp--open]="open()">
  <div class="tp__header">
    <span class="tp__label">{{ label() }}</span>
    <d4m-toggle
      [(value)]="open"
      [disabled]="disabled()"
      [expanded]="open()"
      [label]="label()"
    />
  </div>

  @if (open()) {
    <div class="tp__content">
      <ng-content select="[expanded]" />
    </div>
  }
</d4m-panel>
