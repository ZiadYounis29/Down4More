<div class="select-wrap" [class.select-wrap--disabled]="disabled()" [class.select-wrap--open]="menuOpen()">
  <select
    #selectEl
    class="select-native"
    tabindex="-1"
    [attr.aria-label]="label() || null"
    [disabled]="disabled()"
    (change)="onSelectionChange($event)"
  >
    @for (option of options(); track $index) {
      <option
        [value]="$index"
        [selected]="$index === selectedIndex()"
        [disabled]="!!option.disabled"
      >
        {{ option.label }}
      </option>
    }
  </select>

  <button
    type="button"
    class="select"
    [attr.aria-label]="label() || null"
    [attr.aria-expanded]="menuOpen()"
    aria-haspopup="listbox"
    [disabled]="disabled()"
    (click)="toggleMenu()"
  >
    <span class="select__text">{{ selectedLabel() }}</span>
  </button>

  <svg
    class="chevron"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M6 9l6 6 6-6" />
  </svg>

  @if (menuOpen()) {
    <div class="select-menu" role="listbox" [attr.aria-label]="label() || null">
      @for (option of options(); track $index) {
        <button
          type="button"
          role="option"
          class="select-option"
          [class.select-option--selected]="$index === selectedIndex()"
          [attr.aria-selected]="$index === selectedIndex()"
          [disabled]="!!option.disabled"
          (click)="choose($index)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
