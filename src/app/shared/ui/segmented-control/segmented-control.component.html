<div class="group" role="group" [attr.aria-label]="label() || null">
  @for (option of options(); track $index) {
    @if ($index > 0) {
      <div class="group__divider" aria-hidden="true"></div>
    }
    <button
      type="button"
      class="pill"
      [attr.aria-pressed]="value() === option.value"
      [disabled]="disabled() || !!option.disabled"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
