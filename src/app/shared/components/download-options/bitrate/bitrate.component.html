<select
  class="native-sel"
  [attr.aria-label]="label() || 'Bit-rate'"
  [disabled]="disabled() || null"
  [value]="selectedIndex()"
  (change)="onChange($event)"
>
  @for (opt of options(); track $index) {
    <option [value]="$index" [selected]="$index === selectedIndex()">{{ opt }} kbps</option>
  }
</select>
