<div class="cap" [class.cap--disabled]="disabled()">
  <div class="cap__group">
    <span class="cap__lbl">Caption</span>
    <d4m-select
      [value]="captionChoice()"
      (valueChange)="onCaptionChange($event)"
      [options]="boolOptions"
      [disabled]="disabled()"
      label="Caption"
    />
  </div>
  <div class="cap__divider" aria-hidden="true"></div>
  <div class="cap__group">
    <span class="cap__lbl">Separate file</span>
    <d4m-select
      [value]="separateChoice()"
      (valueChange)="onSeparateChange($event)"
      [options]="boolOptions"
      [disabled]="!captionEnabled() || lockSeparate() || disabled()"
      label="Separate file"
    />
  </div>
</div>
