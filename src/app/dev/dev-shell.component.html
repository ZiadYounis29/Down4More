<div class="dev">
  <nav class="dev__sidebar" aria-label="Component playground">
    @for (group of groups; track group.name) {
      <p class="dev__group-label">{{ group.name }}</p>
      @for (entry of group.entries; track entry.id) {
        <a
          class="dev__tab"
          [routerLink]="entry.id"
          routerLinkActive="on"
          [attr.aria-current]="null"
          >{{ entry.label }}</a
        >
      }
    }
  </nav>
  <div class="dev__content">
    <div class="dev__toolbar">
      <button
        type="button"
        class="btn btn--icon"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="theme.toggle()"
      >
        <d4m-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
    </div>
    <router-outlet />
  </div>
</div>
