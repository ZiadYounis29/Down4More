<section class="demo-section">
  <h2>Trim Video (Single)</h2>

  <h3>Collapsed (open=false)</h3>
  <d4m-trim-video [(open)]="collapsedOpen" [durationSec]="300" />

  <h3>All segments — virtual default (open=true, segments=[])</h3>
  <d4m-trim-video
    [(open)]="allSegmentsOpen"
    [durationSec]="300"
    [(segments)]="allSegmentsSegs"
  />

  <h3>Three segments (open=true)</h3>
  <d4m-trim-video
    [(open)]="threeOpen"
    [durationSec]="300"
    [(segments)]="threeSegs"
  />

  <h3>Unknown duration — disabled state (durationSec=null)</h3>
  <d4m-trim-video
    [(open)]="disabledOpen"
    [durationSec]="null"
  />
</section>
